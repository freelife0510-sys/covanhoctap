name: Validate application
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: covanhoctap_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/covanhoctap_test
      - run: npm run test:curriculum
      - run: npm run build
        env:
          GEMINI_API_KEY: CANARY_SERVER_KEY_NEVER_IN_BROWSER
          SUPABASE_SECRET_KEY: CANARY_SERVER_KEY_NEVER_IN_BROWSER
      - run: npm run scan:build
      - run: npm run build:server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            playwright-report/
            test-results/
            docs/CURRICULUM_REVIEW.csv
# This workflow never promotes production. Live provider/preview gates need
# trusted credentials and a separate, explicitly operated acceptance run.
